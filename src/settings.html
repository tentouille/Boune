<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Réglages de Boune</title>
  <style>
    :root {
      --bg: #fff7f9; --card: #ffffff; --ink: #4a3a42; --muted: #9a8790;
      --pink: #ff7b9c; --pink-soft: #ffc9d6; --line: #f3dde4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; }
    body { padding: 18px 20px 24px; }
    h1 { margin: 0 0 2px; font-size: 20px; }
    h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
    p.hint { margin: 0 0 16px; color: var(--muted); font-size: 12.5px; }
    section { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
    section h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--pink); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
    .row + .row { border-top: 1px dashed var(--line); }
    label { flex: 1; }
    label small { display: block; color: var(--muted); font-size: 11.5px; }
    input[type=number], input[type=text], select {
      width: 110px; padding: 5px 8px; border: 1.5px solid var(--line); border-radius: 8px; font: inherit; color: var(--ink); background: #fff; outline: none;
    }
    input[type=text] { width: 100%; }
    input:focus, select:focus { border-color: var(--pink-soft); }
    input[type=range] { width: 130px; accent-color: var(--pink); }
    .toggle { position: relative; width: 42px; height: 24px; flex: none; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle span { position: absolute; inset: 0; background: #e8dde1; border-radius: 24px; transition: .2s; cursor: pointer; }
    .toggle span::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .toggle input:checked + span { background: var(--pink); }
    .toggle input:checked + span::before { transform: translateX(18px); }
    .actions { display: flex; gap: 10px; margin-top: 4px; }
    button { flex: 1; padding: 9px 12px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; background: var(--pink); color: #fff; }
    button.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
    button.danger { background: #fff; color: #d64562; border: 1.5px solid #f5c2cc; }
    .balance { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .balance b { font-size: 22px; }
    .balance small { color: var(--muted); font-size: 12px; }
    .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .good { border: 1.5px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
    .good .pic { height: 44px; display: flex; align-items: flex-end; }
    .good .pic svg { max-width: 96px; max-height: 44px; }
    .good .nm { font-size: 12.5px; font-weight: 600; }
    .good button { padding: 5px 10px; font-size: 12.5px; flex: none; width: 100%; }
    .good button:disabled { background: #eee2e6; color: #b09aa2; cursor: default; }
    .inv { display: flex; flex-direction: column; gap: 6px; }
    .inv .row { padding: 6px 0; }
    .inv .row + .row { border-top: 1px dashed var(--line); }
    .inv .st { font-size: 11.5px; color: var(--muted); }
    .inv button { flex: none; padding: 5px 10px; font-size: 12.5px; }
    #shopmsg { font-size: 12px; color: #d64562; min-height: 14px; margin-top: 6px; }
    #saved { text-align: center; color: var(--muted); font-size: 12px; height: 16px; margin-top: 8px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tabs button { flex: 1; padding: 9px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--muted); font-weight: 700; }
    .tabs button.active { background: var(--pink); color: #fff; border-color: var(--pink); }
  </style>
</head>
<body>
  <h1>Boune <small>réglages</small></h1>
  <p class="hint">Les changements s'appliquent immédiatement.</p>
  <div class="actions" style="margin-bottom: 14px;">
    <button class="danger" id="quit" style="flex: 1;">Quitter Boune 👋</button>
  </div>

  <div class="tabs">
    <button id="tab-shop-btn" class="active">🛒 Boutique</button>
    <button id="tab-set-btn">⚙️ Réglages</button>
  </div>

  <div id="tab-shop">
  <section>
    <h2>Boutique</h2>
    <div class="balance"><div><b id="crottes">0</b> 💩 <small>crottes ramassées</small></div><small>Clique sur les crottes au sol pour les ramasser</small></div>
    <div class="shop" id="shop"></div>
    <div id="shopmsg"></div>
  </section>

  <section>
    <h2>Mes objets</h2>
    <div class="inv" id="inv"><small class="st">Rien pour l'instant. Achète un objet, puis place-le le long de la barre des tâches.</small></div>
  </section>

  </div>

  <div id="tab-settings" hidden>
  <section>
    <h2>Général</h2>
    <div class="row">
      <label>Lancer avec Windows<small>Boune apparaît à l'ouverture de session</small></label>
      <div class="toggle"><input type="checkbox" id="autostart"><span></span></div>
    </div>
    <div class="row">
      <label>Taille<small>petite ↔ grande</small></label>
      <input type="range" id="size" min="0.7" max="1.5" step="0.05">
    </div>
    <div class="row">
      <label>Vitesse de balade</label>
      <select id="speed">
        <option value="1.6">Tranquille</option>
        <option value="2.6">Normale</option>
        <option value="4">Énergique</option>
      </select>
    </div>
    <div class="row">
      <label>Bavardage<small>fréquence des petites phrases</small></label>
      <select id="chatter">
        <option value="0">Silencieuse</option>
        <option value="0.5">Discrète</option>
        <option value="1">Normale</option>
        <option value="1.8">Bavarde</option>
      </select>
    </div>
  </section>

  <section>
    <h2>Dodo</h2>
    <div class="row">
      <label>Siestes spontanées</label>
      <select id="nap">
        <option value="0">Jamais</option>
        <option value="0.02">Rares</option>
        <option value="0.04">Normales</option>
        <option value="0.1">Grosse dormeuse</option>
      </select>
    </div>
    <div class="row">
      <label>S'endort si tu es absent<small>minutes sans bouger la souris</small></label>
      <input type="number" id="idleMin" min="1" max="120">
    </div>
  </section>

  <section>
    <h2>Anti doom-scroll</h2>
    <div class="row">
      <label>Activé<small>elle minimise la fenêtre, tu peux la rouvrir</small></label>
      <div class="toggle"><input type="checkbox" id="scrollOn"><span></span></div>
    </div>
    <div class="row">
      <label>Tolérance<small>minutes avant qu'elle intervienne</small></label>
      <input type="number" id="scrollMin" min="1" max="120">
    </div>
    <div class="row">
      <label>Répit après intervention<small>minutes</small></label>
      <input type="number" id="cooldownMin" min="1" max="180">
    </div>
    <div class="row" style="flex-direction: column; align-items: stretch; gap: 4px;">
      <label>Mots surveillés dans le titre de la fenêtre<small>séparés par des virgules, sans distinction de casse</small></label>
      <input type="text" id="patterns">
    </div>
  </section>

  <div class="actions">
    <button class="ghost" id="defaults">Valeurs par défaut</button>
    <button class="danger" id="reset">Effacer la progression</button>
  </div>
  </div>

  <div id="saved"></div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { emit } = window.__TAURI__.event;
    const KEY = "boune.settings.v1";
    const DEF = { size: 1, speed: 2.6, chatter: 1, nap: 0.04, idleMin: 6, scrollOn: true, scrollMin: 3, cooldownMin: 10, patterns: "tiktok, reels, shorts" };

    const $ = (id) => document.getElementById(id);
    const fields = Object.keys(DEF);

    function load() {
      let s = {};
      try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
      return { ...DEF, ...s };
    }
    function fill(s) {
      for (const k of fields) {
        const el = $(k);
        if (el.type === "checkbox") el.checked = !!s[k];
        else el.value = s[k];
      }
    }
    function read() {
      const s = {};
      for (const k of fields) {
        const el = $(k);
        s[k] = el.type === "checkbox" ? el.checked : el.type === "text" ? el.value : Number(el.value);
      }
      return s;
    }
    let savedT = 0;
    function save() {
      const s = read();
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
      emit("settings-changed", s);
      $("saved").textContent = "Enregistré ✓";
      clearTimeout(savedT);
      savedT = setTimeout(() => ($("saved").textContent = ""), 1200);
    }

    fill(load());
    for (const k of fields) $(k).addEventListener(k === "patterns" ? "change" : "input", save);

    invoke("autostart_get").then((v) => ($("autostart").checked = v)).catch(() => {});
    $("autostart").addEventListener("change", (e) => {
      invoke("autostart_set", { enabled: e.target.checked }).catch(() => { e.target.checked = !e.target.checked; });
    });

    $("defaults").addEventListener("click", () => { fill(DEF); save(); });
    $("reset").addEventListener("click", (e) => {
      if (e.target.dataset.armed) {
        emit("reset-progress");
        e.target.textContent = "Progression effacée";
        delete e.target.dataset.armed;
        setTimeout(() => (e.target.textContent = "Effacer la progression"), 1500);
      } else {
        e.target.dataset.armed = "1";
        e.target.textContent = "Sûr ? Clique encore";
        setTimeout(() => { delete e.target.dataset.armed; e.target.textContent = "Effacer la progression"; }, 3000);
      }
    });
    function showTab(t) {
      const shop = t !== "set";
      $("tab-shop").hidden = !shop;
      $("tab-settings").hidden = shop;
      $("tab-shop-btn").classList.toggle("active", shop);
      $("tab-set-btn").classList.toggle("active", !shop);
      try { localStorage.setItem("boune.tab", t); } catch {}
    }
    $("tab-shop-btn").addEventListener("click", () => showTab("shop"));
    $("tab-set-btn").addEventListener("click", () => showTab("set"));
    try { showTab(localStorage.getItem("boune.tab") || "shop"); } catch { showTab("shop"); }
    $("quit").addEventListener("click", () => emit("quit-boune"));
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // ---------- Boutique / inventaire ----------
    const { listen } = window.__TAURI__.event;
    const CATALOG = {
      water:  { name: "Gamelle d'eau", price: 30, svg: `<svg viewBox="0 0 54 30" width="54"><path d="M4 12 q23 -6 46 0 l-4 12 q-19 5 -38 0z" fill="#8fb8d8"/><ellipse cx="27" cy="12" rx="23" ry="5" fill="#bfe0f5"/><ellipse cx="27" cy="12.5" rx="18" ry="3.2" fill="#7fc4ec"/></svg>` },
      food:   { name: "Gamelle de foin", price: 30, svg: `<svg viewBox="0 0 54 32" width="54"><path d="M4 14 q23 -6 46 0 l-4 12 q-19 5 -38 0z" fill="#d98c6b"/><ellipse cx="27" cy="14" rx="23" ry="5" fill="#f0b494"/><path d="M10 12 l8 -8 M16 13 l10 -9 M24 12 l9 -8 M32 13 l8 -7 M38 13 l6 -4" stroke="#d9b45a" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="27" cy="13" rx="17" ry="2.6" fill="#c9a24e"/></svg>` },
      treats: { name: "Pot à friandises", price: 55, svg: `<svg viewBox="0 0 34 40" width="34"><rect x="5" y="8" width="24" height="28" rx="6" fill="#dbeff8" stroke="#a9cfe4" stroke-width="1.5"/><rect x="7" y="3" width="20" height="7" rx="2" fill="#ff7b9c"/><circle cx="12" cy="24" r="3.5" fill="#fb923c"/><circle cx="20" cy="28" r="3.5" fill="#f59e0b"/><circle cx="21" cy="19" r="3" fill="#fb923c"/></svg>` },
      bed:    { name: "Panier douillet", price: 90, svg: `<svg viewBox="0 0 96 44" width="90"><path d="M4 22 q0 -12 14 -12 h60 q14 0 14 12 v10 q0 8 -10 8 h-68 q-10 0 -10 -8z" fill="#c99a6b"/><path d="M8 22 q0 -8 10 -8 h60 q10 0 10 8 v8 q0 6 -8 6 h-64 q-8 0 -8 -6z" fill="#e0b98c"/><ellipse cx="48" cy="28" rx="34" ry="9" fill="#ffd3dc"/></svg>` },
      stick:  { name: "Branche de pommier", price: 20, svg: `<svg viewBox="0 0 60 18" width="60"><path d="M3 11 q14 -8 28 -3 q12 4 26 -2" stroke="#8b5e3c" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M20 7 l4 -5 M40 8 l3 -5" stroke="#8b5e3c" stroke-width="2.5" stroke-linecap="round"/></svg>` },
      ball:   { name: "Balle en osier", price: 24, svg: `<svg viewBox="0 0 30 30" width="30"><circle cx="15" cy="14" r="12" fill="#d9b784"/><path d="M4 10 q11 -6 22 0 M3 14 q12 -4 24 0 M4 18 q11 6 22 0 M9 3.5 q6 10.5 0 21 M21 3.5 q-6 10.5 0 21" stroke="#b08d5a" stroke-width="1.3" fill="none"/></svg>` },
      rug:    { name: "Petit tapis", price: 16, svg: `<svg viewBox="0 0 110 14" width="96"><rect x="2" y="2" width="106" height="10" rx="5" fill="#a5b4d6"/><rect x="10" y="2" width="14" height="10" fill="#ffd3dc"/><rect x="38" y="2" width="14" height="10" fill="#ffd3dc"/><rect x="66" y="2" width="14" height="10" fill="#ffd3dc"/></svg>` },
    };
    const readJSON = (k) => { try { return JSON.parse(localStorage.getItem(k)) || null; } catch { return null; } };
    function renderShop() {
      const save = readJSON("boune.save.v1") || {};
      const scene = readJSON("boune.scene.v1") || { placed: [] };
      const crottes = save.crottes || 0;
      $("crottes").textContent = crottes;
      $("shop").innerHTML = Object.entries(CATALOG).map(([id, c]) => `
        <div class="good"><div class="pic">${c.svg}</div><div class="nm">${c.name}</div>
        <button data-buy="${id}" ${crottes < c.price ? "disabled" : ""}>${c.price} 💩</button></div>`).join("");
      const items = save.items || [];
      const placed = new Set(scene.placed.map((p) => p.uid));
      $("inv").innerHTML = items.length ? items.map((it) => `
        <div class="row"><label>${CATALOG[it.type].name}<span class="st"> · ${placed.has(it.uid) ? "posé" : "rangé"}</span></label>
        ${placed.has(it.uid) ? `<button class="ghost" data-remove="${it.uid}">Ranger</button>` : `<button data-place="${it.uid}" data-type="${it.type}">Placer</button>`}</div>`).join("")
        : `<small class="st">Rien pour l'instant. Achète un objet, puis place-le le long de la barre des tâches.</small>`;
    }
    document.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.buy) { emit("shop-buy", { type: b.dataset.buy }); $("shopmsg").textContent = ""; }
      if (b.dataset.place) { emit("scene-place", { uid: b.dataset.place, type: b.dataset.type }); $("shopmsg").textContent = "Pose-le avec la souris le long de la barre des tâches."; $("shopmsg").style.color = "var(--muted)"; }
      if (b.dataset.remove) emit("scene-remove", { uid: b.dataset.remove });
    });
    listen("save-changed", () => setTimeout(renderShop, 50));
    listen("scene-changed", () => setTimeout(renderShop, 50));
    listen("shop-refused", ({ payload }) => { $("shopmsg").style.color = "#d64562"; $("shopmsg").textContent = payload; });
    renderShop();
    window.addEventListener("focus", renderShop);
  </script>
</body>
</html>
