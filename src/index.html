<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Boune</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"></div>
    <div id="fx"></div>

    <div id="bunny">
      <div id="sprite">
        <div id="zzz" class="hidden"><span>z</span><span>z</span><span>z</span></div>
        <div id="prop" class="hidden"></div>

        <svg id="svg" viewBox="0 0 120 120" width="110" height="110" aria-label="Boune, lapine tête de lion">
          <!-- Palette : crème #fbf5ec→#d6c1a8 / mèches #fdf8f0 / brun #54392c / brun clair #9b7a68 -->
          <defs>
            <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf5ec"/><stop offset="1" stop-color="#d6c1a8"/></linearGradient>
            <radialGradient id="gHead" cx="42%" cy="35%" r="70%"><stop offset="0" stop-color="#fdf8f0"/><stop offset="1" stop-color="#dcc8b0"/></radialGradient>
            <radialGradient id="gMask" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#4f3629"/><stop offset=".55" stop-color="#7a5a48" stop-opacity=".9"/><stop offset="1" stop-color="#a68a76" stop-opacity="0"/></radialGradient>
          </defs>

          <!-- Queue : petit pompon à l'arrière -->
          <g id="tail" fill="#fdf8f0" stroke="#e3d2bd" stroke-width="1">
            <circle cx="17" cy="84" r="6"/><circle cx="13" cy="90" r="5.5"/><circle cx="20" cy="92" r="5"/>
          </g>

          <!-- Corps (posée de trois quarts, tête à droite) -->
          <g id="body">
            <ellipse cx="54" cy="90" rx="40" ry="21" fill="url(#gBody)" stroke="#e3d2bd" stroke-width="1"/>
            <ellipse cx="54" cy="99.5" rx="32" ry="10.5" fill="#000" opacity=".05"/>
          </g>
          <g id="feet">
            <ellipse cx="86" cy="106.4" rx="11" ry="4.5" fill="#e3d2bd" stroke="#e3d2bd" stroke-width="1"/>
          </g>
          <ellipse cx="80" cy="95.6" rx="28.4" ry="7" fill="#000" opacity=".10"/>

          <!-- Tête -->
          <g id="head">
            <!-- Oreilles courtes, brun foncé -->
            <g id="ear-l" class="ear">
              <path d="M64 30 C62 12 74 8 78 20 C80 28 78 40 74 44 Z" fill="#54392c" stroke="#e3d2bd" stroke-width="1"/>
              <path d="M68 30 C68 18 74 16 76 24 C77 30 75 36 73 40 Z" fill="#9b7a68" opacity=".75"/>
            </g>
            <g id="ear-r" class="ear">
              <path d="M86 32 C88 14 100 12 100 24 C100 32 96 42 90 46 Z" fill="#54392c" stroke="#e3d2bd" stroke-width="1"/>
              <path d="M90 34 C91 22 97 20 97 26 C97 32 94 38 91 42 Z" fill="#9b7a68" opacity=".75"/>
            </g>

            <!-- Crinière : mèches arrondies (générées, mêmes paramètres que la planche G0) -->
            <g id="mane" fill="#fdf8f0" stroke="#e3d2bd" stroke-width="1">
              <path d="M79.9 93.0 C82.7 111.9 62.1 108.0 69.7 90.6 Z"/>
              <path d="M70.1 90.8 C63.3 109.1 46.4 96.1 61.9 84.2 Z"/>
              <path d="M63.6 86.1 C49.5 104.2 36.7 85.1 58.2 77.2 Z"/>
              <path d="M59.0 79.4 C37.5 86.2 34.9 63.5 57.0 69.1 Z"/>
              <path d="M57.1 71.7 C27.7 73.8 32.4 47.9 58.7 61.3 Z"/>
              <path d="M58.5 61.8 C36.4 50.3 51.4 31.7 64.4 53.1 Z"/>
              <path d="M62.8 54.7 C44.5 37.4 64.7 24.3 71.4 48.7 Z"/>
              <path d="M68.9 49.8 C52.8 30.3 75.4 22.1 79.0 47.0 Z"/>
              <path d="M77.0 47.2 C76.0 21.9 99.8 26.0 87.5 48.2 Z"/>
              <path d="M85.5 47.7 C86.3 22.2 108.6 31.3 94.8 52.4 Z"/>
              <path d="M92.0 50.4 C101.5 29.3 118.5 44.8 99.5 57.8 Z"/>
              <path d="M99.3 57.4 C124.4 42.6 132.1 67.5 102.8 67.3 Z"/>
            </g>

            <ellipse cx="80" cy="70" rx="27" ry="25" fill="url(#gHead)" stroke="#e3d2bd" stroke-width="1"/>
            <path d="M60 52 q2 -10 10 -8 M72 46 q3 -8 9 -4 M84 46 q4 -6 8 -1" fill="none" stroke="#fdf8f0" stroke-width="3" stroke-linecap="round"/>

            <!-- Masque brun + nez + bouche -->
            <ellipse cx="86" cy="82" rx="14" ry="11" fill="url(#gMask)"/>
            <path d="M82.5 80 h7 l-3.5 4z" fill="#241a16"/>
            <path id="mouth" d="M86 84 q-3 3 -6 1 M86 84 q3 3 6 1" stroke="#3b2a24" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".8"/>

            <!-- Yeux -->
            <g id="eyes">
              <g class="eye-open">
                <ellipse cx="70" cy="70" rx="3.6" ry="4" fill="#1d1412"/>
                <ellipse cx="94" cy="70" rx="3.2" ry="3.6" fill="#1d1412"/>
                <circle cx="71.4" cy="68.4" r="1.2" fill="#fff"/>
                <circle cx="95.2" cy="68.4" r="1.1" fill="#fff"/>
              </g>
              <g class="eye-closed">
                <path d="M66 71 q4 3.5 8 0" stroke="#1d1412" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M90.5 71 q3.5 3.2 7 0" stroke="#1d1412" stroke-width="2" fill="none" stroke-linecap="round"/>
              </g>
              <g class="eye-happy">
                <path d="M66 72 q4 -4 8 0" stroke="#1d1412" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M90.5 72 q3.5 -3.6 7 0" stroke="#1d1412" stroke-width="2" fill="none" stroke-linecap="round"/>
              </g>
              <g class="eye-angry">
                <ellipse cx="70" cy="71" rx="3.3" ry="3.4" fill="#1d1412"/>
                <ellipse cx="94" cy="71" rx="3" ry="3.1" fill="#1d1412"/>
                <path d="M64 64 l10 3 M100 65 l-9 2.5" stroke="#1d1412" stroke-width="2" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Accessoires (débloqués avec les niveaux) -->
            <g id="acc-bow" class="acc">
              <path d="M94 48 l-8 -6 v12z" fill="#ff7b9c"/>
              <path d="M94 48 l8 -6 v12z" fill="#ff7b9c"/>
              <circle cx="94" cy="48" r="2.3" fill="#ff5c85"/>
            </g>
            <g id="acc-crown" class="acc">
              <circle cx="58" cy="52" r="3.3" fill="#ffd166"/>
              <circle cx="66" cy="46" r="3.3" fill="#ff8fab"/>
              <circle cx="75" cy="43" r="3.3" fill="#a0e7e5"/>
              <circle cx="84" cy="43" r="3.3" fill="#ff8fab"/>
              <circle cx="93" cy="46" r="3.3" fill="#ffd166"/>
            </g>
          </g>

          <g id="acc-scarf" class="acc">
            <path d="M56 92 q24 9 48 -1 v6 q-24 10 -48 1z" fill="#ff7b9c"/>
            <path d="M100 94 l6 14 l-8 1z" fill="#ff7b9c"/>
          </g>
        </svg>
      </div>
      <div id="shadow"></div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
