<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Boune</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"></div>
    <div id="fx"></div>

    <div id="bunny">
      <div id="sprite">
        <div id="zzz" class="hidden"><span>z</span><span>z</span><span>z</span></div>
        <div id="prop" class="hidden"></div>

        <svg id="svg" viewBox="0 0 120 130" width="110" height="120" aria-label="Boune le lapin">
          <!-- Oreilles -->
          <g id="ear-l" class="ear">
            <ellipse cx="44" cy="36" rx="9.5" ry="30" fill="#fff6ec" stroke="#eadbcf" stroke-width="1.5"/>
            <ellipse cx="44" cy="38" rx="4.5" ry="21" fill="#ffc9d6"/>
          </g>
          <g id="ear-r" class="ear">
            <ellipse cx="72" cy="36" rx="9.5" ry="30" fill="#fff6ec" stroke="#eadbcf" stroke-width="1.5"/>
            <ellipse cx="72" cy="38" rx="4.5" ry="21" fill="#ffc9d6"/>
          </g>

          <!-- Queue -->
          <circle cx="93" cy="105" r="8" fill="#ffffff" stroke="#eadbcf" stroke-width="1.5"/>

          <!-- Corps -->
          <ellipse cx="58" cy="102" rx="34" ry="24" fill="#fff6ec" stroke="#eadbcf" stroke-width="1.5"/>

          <!-- Pattes -->
          <g id="feet">
            <ellipse cx="38" cy="122" rx="12" ry="6" fill="#fff6ec" stroke="#eadbcf" stroke-width="1.5"/>
            <ellipse cx="74" cy="122" rx="12" ry="6" fill="#fff6ec" stroke="#eadbcf" stroke-width="1.5"/>
          </g>

          <!-- Tête -->
          <g id="head">
            <circle cx="58" cy="74" r="29" fill="#fff6ec" stroke="#eadbcf" stroke-width="1.5"/>

            <!-- Joues -->
            <ellipse cx="39" cy="83" rx="6" ry="3.5" fill="#ffb3c4" opacity=".75"/>
            <ellipse cx="77" cy="83" rx="6" ry="3.5" fill="#ffb3c4" opacity=".75"/>

            <!-- Yeux -->
            <g id="eyes">
              <g class="eye-open">
                <circle cx="47" cy="72" r="3.8" fill="#33262b"/>
                <circle cx="48.4" cy="70.6" r="1.3" fill="#fff"/>
                <circle cx="69" cy="72" r="3.8" fill="#33262b"/>
                <circle cx="70.4" cy="70.6" r="1.3" fill="#fff"/>
              </g>
              <g class="eye-closed">
                <path d="M43 73 q4 3.5 8 0" stroke="#33262b" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M65 73 q4 3.5 8 0" stroke="#33262b" stroke-width="2" fill="none" stroke-linecap="round"/>
              </g>
              <g class="eye-happy">
                <path d="M43 74 q4 -4 8 0" stroke="#33262b" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M65 74 q4 -4 8 0" stroke="#33262b" stroke-width="2" fill="none" stroke-linecap="round"/>
              </g>
              <g class="eye-angry">
                <circle cx="47" cy="73" r="3.4" fill="#33262b"/>
                <circle cx="69" cy="73" r="3.4" fill="#33262b"/>
                <path d="M41 66 l10 3 M75 66 l-10 3" stroke="#33262b" stroke-width="2" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Nez + bouche -->
            <path d="M55.5 79.5 h5 l-2.5 3.2z" fill="#ff9fb6"/>
            <path id="mouth" d="M58 82.5 q-2.5 3 -5 1.2 M58 82.5 q2.5 3 5 1.2" stroke="#c98a98" stroke-width="1.3" fill="none" stroke-linecap="round"/>

            <!-- Accessoires (débloqués avec les niveaux) -->
            <g id="acc-bow" class="acc">
              <path d="M72 60 l-9 -6 v12z" fill="#ff7b9c"/>
              <path d="M72 60 l9 -6 v12z" fill="#ff7b9c"/>
              <circle cx="72" cy="60" r="2.4" fill="#ff5c85"/>
            </g>
            <g id="acc-crown" class="acc">
              <circle cx="40" cy="52" r="3.5" fill="#ffd166"/>
              <circle cx="49" cy="47" r="3.5" fill="#ff8fab"/>
              <circle cx="58" cy="45" r="3.5" fill="#a0e7e5"/>
              <circle cx="67" cy="47" r="3.5" fill="#ff8fab"/>
              <circle cx="76" cy="52" r="3.5" fill="#ffd166"/>
            </g>
          </g>

          <g id="acc-scarf" class="acc">
            <path d="M31 96 q27 11 54 0 v7 q-27 11 -54 0z" fill="#ff7b9c"/>
            <path d="M79 100 l7 15 l-9 1z" fill="#ff7b9c"/>
          </g>
        </svg>
      </div>
      <div id="shadow"></div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
