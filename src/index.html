<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Boune</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"></div>
    <div id="fx"></div>

    <div id="bunny">
      <div id="sprite">
        <div id="zzz" class="hidden"><span>z</span><span>z</span><span>z</span></div>
        <div id="prop" class="hidden"></div>

        <svg id="svg" viewBox="0 0 120 130" width="110" height="120" aria-label="Boune, lapin tête de lion">
          <!-- Palette : crème #f6ecdf / ombre #e9dac8 / brun #5e4335 / brun clair #8c6a58 -->

          <!-- Oreilles : courtes, brun foncé, intérieur plus clair -->
          <g id="ear-l" class="ear">
            <ellipse cx="44" cy="40" rx="8.5" ry="23" fill="#5e4335"/>
            <ellipse cx="44" cy="42" rx="4" ry="15" fill="#8c6a58"/>
          </g>
          <g id="ear-r" class="ear">
            <ellipse cx="72" cy="40" rx="8.5" ry="23" fill="#5e4335"/>
            <ellipse cx="72" cy="42" rx="4" ry="15" fill="#8c6a58"/>
          </g>

          <!-- Queue -->
          <circle cx="93" cy="105" r="8" fill="#fbf5ec" stroke="#e9dac8" stroke-width="1.5"/>

          <!-- Corps : boule de poils (bosses de fourrure autour de l'ellipse) -->
          <g id="body">
            <g fill="#f6ecdf" stroke="#e9dac8" stroke-width="1.5">
              <circle cx="30" cy="98" r="9"/><circle cx="26" cy="108" r="8"/>
              <circle cx="36" cy="118" r="8"/><circle cx="52" cy="124" r="8"/>
              <circle cx="70" cy="124" r="8"/><circle cx="84" cy="118" r="8"/>
              <circle cx="90" cy="106" r="8"/><circle cx="88" cy="94" r="8"/>
            </g>
            <ellipse cx="58" cy="104" rx="34" ry="22" fill="#f6ecdf"/>
            <!-- ombre du ventre -->
            <ellipse cx="58" cy="112" rx="24" ry="10" fill="#efe1d0"/>
          </g>

          <!-- Pattes : légèrement plus foncées -->
          <g id="feet">
            <ellipse cx="38" cy="123" rx="12" ry="6" fill="#e6d3bf" stroke="#d9c4ae" stroke-width="1.2"/>
            <ellipse cx="74" cy="123" rx="12" ry="6" fill="#e6d3bf" stroke="#d9c4ae" stroke-width="1.2"/>
          </g>

          <!-- Tête -->
          <g id="head">
            <!-- Crinière : mèches tout autour, plus claires -->
            <g id="mane" fill="#fbf5ec" stroke="#e9dac8" stroke-width="1.2">
              <circle cx="34" cy="60" r="8"/><circle cx="29" cy="72" r="8"/>
              <circle cx="31" cy="84" r="7"/><circle cx="40" cy="94" r="7"/>
              <circle cx="82" cy="60" r="8"/><circle cx="87" cy="72" r="8"/>
              <circle cx="85" cy="84" r="7"/><circle cx="76" cy="94" r="7"/>
              <circle cx="46" cy="49" r="7"/><circle cx="70" cy="49" r="7"/>
              <!-- houppette entre les oreilles -->
              <circle cx="58" cy="46" r="7"/><circle cx="52" cy="48" r="5"/><circle cx="64" cy="48" r="5"/>
            </g>
            <circle cx="58" cy="74" r="29" fill="#f6ecdf"/>
            <!-- mèches folles sur le front -->
            <path d="M48 50 q3 -9 8 -3 M56 46 q2 -10 7 -4 M64 49 q5 -8 8 -2" stroke="#fbf5ec" stroke-width="3" fill="none" stroke-linecap="round"/>

            <!-- Masque brun autour du nez -->
            <ellipse cx="58" cy="83" rx="13" ry="9" fill="#8c6a58" opacity=".55"/>
            <ellipse cx="58" cy="83" rx="8.5" ry="6" fill="#5e4335" opacity=".85"/>

            <!-- Joues (discret) -->
            <ellipse cx="38" cy="82" rx="5.5" ry="3" fill="#f2b8c2" opacity=".45"/>
            <ellipse cx="78" cy="82" rx="5.5" ry="3" fill="#f2b8c2" opacity=".45"/>

            <!-- Yeux -->
            <g id="eyes">
              <g class="eye-open">
                <circle cx="46" cy="72" r="3.9" fill="#231816"/>
                <circle cx="47.4" cy="70.6" r="1.3" fill="#fff"/>
                <circle cx="70" cy="72" r="3.9" fill="#231816"/>
                <circle cx="71.4" cy="70.6" r="1.3" fill="#fff"/>
              </g>
              <g class="eye-closed">
                <path d="M42 73 q4 3.5 8 0" stroke="#231816" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M66 73 q4 3.5 8 0" stroke="#231816" stroke-width="2" fill="none" stroke-linecap="round"/>
              </g>
              <g class="eye-happy">
                <path d="M42 74 q4 -4 8 0" stroke="#231816" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M66 74 q4 -4 8 0" stroke="#231816" stroke-width="2" fill="none" stroke-linecap="round"/>
              </g>
              <g class="eye-angry">
                <circle cx="46" cy="73" r="3.4" fill="#231816"/>
                <circle cx="70" cy="73" r="3.4" fill="#231816"/>
                <path d="M40 66 l10 3 M76 66 l-10 3" stroke="#231816" stroke-width="2" stroke-linecap="round"/>
              </g>
            </g>

            <!-- Nez + bouche -->
            <path d="M55 81.5 h6 l-3 3.5z" fill="#2e211c"/>
            <path id="mouth" d="M58 85 q-2.5 3 -5 1.2 M58 85 q2.5 3 5 1.2" stroke="#3b2a24" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".8"/>

            <!-- Accessoires (débloqués avec les niveaux) -->
            <g id="acc-bow" class="acc">
              <path d="M72 58 l-9 -6 v12z" fill="#ff7b9c"/>
              <path d="M72 58 l9 -6 v12z" fill="#ff7b9c"/>
              <circle cx="72" cy="58" r="2.4" fill="#ff5c85"/>
            </g>
            <g id="acc-crown" class="acc">
              <circle cx="40" cy="54" r="3.5" fill="#ffd166"/>
              <circle cx="49" cy="49" r="3.5" fill="#ff8fab"/>
              <circle cx="58" cy="47" r="3.5" fill="#a0e7e5"/>
              <circle cx="67" cy="49" r="3.5" fill="#ff8fab"/>
              <circle cx="76" cy="54" r="3.5" fill="#ffd166"/>
            </g>
          </g>

          <g id="acc-scarf" class="acc">
            <path d="M31 98 q27 11 54 0 v7 q-27 11 -54 0z" fill="#ff7b9c"/>
            <path d="M79 102 l7 15 l-9 1z" fill="#ff7b9c"/>
          </g>
        </svg>
      </div>
      <div id="shadow"></div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
