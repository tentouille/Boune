<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Boune</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"></div>
    <div id="fx"></div>

    <div id="bunny">
      <div id="sprite">
        <div id="zzz" class="hidden"><span>z</span><span>z</span><span>z</span></div>
        <div id="prop" class="hidden"></div>

        <svg id="svg" viewBox="0 0 120 120" width="110" height="110" aria-label="Boune">
          <!-- Palette : crème #f6ecdf / ombre #e3d2bd / brun #54392c / brun clair #8c6a58 -->
          <g id="ear-r" class="ear"><ellipse cx="96" cy="26" rx="7.5" ry="23" fill="#54392c" transform="rotate(12 96 26)"/><ellipse cx="96" cy="28" rx="3.4" ry="16" fill="#8c6a58" transform="rotate(12 96 28)"/></g>
          <g id="ear-l" class="ear"><ellipse cx="83" cy="24" rx="8" ry="24" fill="#54392c" transform="rotate(-6 83 24)"/><ellipse cx="83" cy="26" rx="3.8" ry="17" fill="#8c6a58" transform="rotate(-6 83 26)"/></g>
          <g id="tail"><circle cx="16" cy="82" r="9" fill="#fdf8f0"/></g>
          <g id="body">
            <path d="M18 90 C10 66 30 52 56 54 C74 56 86 62 92 72 C98 86 90 104 62 105 C38 105 22 103 18 90 Z" fill="#f6ecdf"/>
            <ellipse cx="56" cy="99" rx="28" ry="7" fill="#e3d2bd" opacity=".45"/>
          </g>
          <g id="feet">
            <circle cx="38" cy="84" r="17" fill="#f6ecdf"/><circle cx="38" cy="84" r="12" fill="#e3d2bd" opacity=".35"/>
            <ellipse cx="46" cy="104" rx="17" ry="5" fill="#e3d2bd"/>
            <ellipse cx="80" cy="103" rx="6.5" ry="4" fill="#e3d2bd"/><ellipse cx="91" cy="103" rx="6.5" ry="4" fill="#e3d2bd"/>
          </g>
          <g id="head">
            <circle cx="90" cy="62" r="23" fill="#f6ecdf"/>
            <ellipse cx="106" cy="70" rx="11" ry="9" fill="#f6ecdf"/>
            <ellipse cx="106" cy="71" rx="10" ry="7" fill="#8c6a58" opacity=".5"/><ellipse cx="109" cy="71" rx="6" ry="5" fill="#54392c" opacity=".8"/>
            <path class="nose" d="M113 68 l4 1.5 l-3 3z" fill="#2e211c"/>
            <path id="mouth" d="M112 74 q-2 3 -5 2" stroke="#3b2a24" stroke-width="1.1" fill="none" stroke-linecap="round" opacity=".7"/>
            <g class="nose" stroke="#cbb89f" stroke-width="1" fill="none" stroke-linecap="round" opacity=".7">
              <path d="M110 71 q10 -3 16 -5"/><path d="M110 73 q11 -1 17 0"/><path d="M110 75 q10 2 16 4"/>
            </g>
            <ellipse cx="98" cy="76" rx="4.5" ry="2.6" fill="#f2b8c2" opacity=".5"/>
            <g class="eyes">
              <g class="eye-open"><circle cx="94" cy="58" r="5" fill="#1d1412"/><circle cx="95.8" cy="56.2" r="1.8" fill="#fff"/><circle cx="92.6" cy="60" r=".9" fill="#fff" opacity=".8"/></g>
              <g class="eye-closed"><path d="M89 59 q5 4 10 0" stroke="#1d1412" stroke-width="2" fill="none" stroke-linecap="round"/></g>
              <g class="eye-happy"><path d="M89 60 q5 -5 10 0" stroke="#1d1412" stroke-width="2" fill="none" stroke-linecap="round"/></g>
              <g class="eye-angry"><circle cx="94" cy="59" r="4.4" fill="#1d1412"/><path d="M87 50 l12 3.5" stroke="#1d1412" stroke-width="2" stroke-linecap="round"/></g>
            </g>
            <g class="acc acc-bow"><path d="M84 42 l-8 -6 v12z" fill="#ff7b9c"/><path d="M84 42 l8 -6 v12z" fill="#ff7b9c"/><circle cx="84" cy="42" r="2.3" fill="#ff5c85"/></g>
            <g class="acc acc-crown"><circle cx="72" cy="46" r="3.2" fill="#ffd166"/><circle cx="79" cy="42" r="3.2" fill="#ff8fab"/><circle cx="90" cy="40" r="3.2" fill="#a0e7e5"/><circle cx="101" cy="42" r="3.2" fill="#ff8fab"/><circle cx="108" cy="48" r="3.2" fill="#ffd166"/></g>
          </g>
          <g class="acc acc-scarf"><path d="M70 82 q14 8 26 2 v6 q-12 8 -26 0z" fill="#ff7b9c"/><path d="M92 86 l6 12 l-8 1z" fill="#ff7b9c"/></g>
        </svg>

        <!-- R3 : dressée sur les pattes arrière (surprise, portée, pousse, regarde au loin) -->
        <svg id="svg-up" viewBox="0 0 120 120" width="110" height="110" aria-hidden="true">
          <g id="ear-l2" class="ear"><ellipse cx="50" cy="20" rx="6.5" ry="20" fill="#54392c" transform="rotate(-10 50 20)"/><ellipse cx="50" cy="22" rx="3" ry="14" fill="#8c6a58" transform="rotate(-10 50 22)"/></g>
          <g id="ear-r2" class="ear"><ellipse cx="72" cy="20" rx="6.5" ry="20" fill="#54392c" transform="rotate(10 72 20)"/><ellipse cx="72" cy="22" rx="3" ry="14" fill="#8c6a58" transform="rotate(10 72 22)"/></g>
          <circle cx="36" cy="100" r="7" fill="#fdf8f0"/>
          <path d="M40 60 C38 48 82 48 82 60 C90 74 92 92 84 104 C70 108 44 108 36 100 C30 88 34 72 40 60 Z" fill="#f6ecdf"/>
          <ellipse cx="62" cy="86" rx="14" ry="16" fill="#fdf8f0" opacity=".7"/>
          <g class="feet"><ellipse cx="46" cy="106" rx="14" ry="5" fill="#e3d2bd"/><ellipse cx="76" cy="106" rx="14" ry="5" fill="#e3d2bd"/></g>
          <g class="arm l"><ellipse cx="50" cy="78" rx="5" ry="7" fill="#f6ecdf"/><ellipse cx="50" cy="83" rx="4.5" ry="3" fill="#e3d2bd"/></g>
          <g class="arm r"><ellipse cx="72" cy="78" rx="5" ry="7" fill="#f6ecdf"/><ellipse cx="72" cy="83" rx="4.5" ry="3" fill="#e3d2bd"/></g>
          <g id="head2">
            <ellipse cx="61" cy="50" rx="21" ry="17" fill="#f6ecdf"/>
            <ellipse cx="66" cy="60" rx="10" ry="7" fill="#8c6a58" opacity=".5"/><ellipse cx="67" cy="60" rx="6" ry="4.5" fill="#54392c" opacity=".8"/>
            <path class="nose" d="M65 58 h5 l-2.5 3z" fill="#2e211c"/>
            <g class="nose" stroke="#cbb89f" stroke-width="1" fill="none" stroke-linecap="round" opacity=".7">
              <path d="M63 60 q-11 -2 -16 -4"/><path d="M63 61 q-11 0 -17 1"/>
              <path d="M71 60 q11 -2 16 -4"/><path d="M71 61 q11 0 17 1"/>
            </g>
            <ellipse cx="46" cy="58" rx="4" ry="2.4" fill="#f2b8c2" opacity=".45"/>
            <g class="eyes">
              <g class="eye-open"><circle cx="52" cy="49" r="3.8" fill="#1d1412"/><circle cx="72" cy="49" r="3.4" fill="#1d1412"/><circle cx="53.4" cy="47.6" r="1.3" fill="#fff"/><circle cx="73.2" cy="47.6" r="1.2" fill="#fff"/></g>
              <g class="eye-closed"><path d="M48 50 q4 3.5 8 0 M68 50 q4 3.5 8 0" stroke="#1d1412" stroke-width="2" fill="none" stroke-linecap="round"/></g>
              <g class="eye-happy"><path d="M48 51 q4 -4 8 0 M68 51 q4 -4 8 0" stroke="#1d1412" stroke-width="2" fill="none" stroke-linecap="round"/></g>
              <g class="eye-angry"><circle cx="52" cy="50" r="3.4" fill="#1d1412"/><circle cx="72" cy="50" r="3.2" fill="#1d1412"/><path d="M46 42 l10 3 M78 42 l-10 3" stroke="#1d1412" stroke-width="2" stroke-linecap="round"/></g>
            </g>
            <g class="acc acc-bow"><path d="M72 36 l-8 -6 v12z" fill="#ff7b9c"/><path d="M72 36 l8 -6 v12z" fill="#ff7b9c"/><circle cx="72" cy="36" r="2.3" fill="#ff5c85"/></g>
            <g class="acc acc-crown"><circle cx="44" cy="40" r="3.2" fill="#ffd166"/><circle cx="52" cy="36" r="3.2" fill="#ff8fab"/><circle cx="61" cy="34" r="3.2" fill="#a0e7e5"/><circle cx="70" cy="36" r="3.2" fill="#ff8fab"/><circle cx="78" cy="40" r="3.2" fill="#ffd166"/></g>
          </g>
          <g class="acc acc-scarf"><path d="M42 66 q19 9 38 0 v6 q-19 9 -38 0z" fill="#ff7b9c"/><path d="M78 68 l6 13 l-8 1z" fill="#ff7b9c"/></g>
        </svg>
      </div>
      <div id="shadow"></div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
